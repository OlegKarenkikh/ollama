name: Docker Build, Security Scan & Publish

on:
  # Запускать вручную или по расписанию (каждый день в 3:00 UTC)
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: 'Upstream ollama tag to sync (e.g. v0.6.5). Leave empty to auto-detect latest.'
        required: false
        default: ''
  schedule:
    - cron: '0 3 * * *'

env:
  DOCKER_IMAGE: ${{ vars.DOCKER_REPO || format('{0}/ollama', github.repository_owner) }}

jobs:
  # ─────────────────────────────────────────────
  # 1. Получить последний стабильный тег из upstream
  # ─────────────────────────────────────────────
  resolve-upstream:
    runs-on: ubuntu-latest
    outputs:
      upstream_tag: ${{ steps.tag.outputs.tag }}
      already_synced: ${{ steps.check.outputs.already_synced }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve upstream tag
        id: tag
        run: |
          INPUT="${{ github.event.inputs.upstream_tag }}"
          if [ -n "$INPUT" ]; then
            echo "tag=$INPUT" >> "$GITHUB_OUTPUT"
          else
            LATEST=$(curl -sf https://api.github.com/repos/ollama/ollama/releases/latest \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              | jq -r .tag_name)
            echo "Detected upstream latest tag: $LATEST"
            echo "tag=$LATEST" >> "$GITHUB_OUTPUT"
          fi

      - name: Check if already synced
        id: check
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          if git tag --list | grep -qx "$TAG"; then
            echo "already_synced=true" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG already present in this repo — skipping sync."
          else
            echo "already_synced=false" >> "$GITHUB_OUTPUT"
          fi

  # ─────────────────────────────────────────────
  # 2. Синхронизировать репозиторий с upstream тегом
  # ─────────────────────────────────────────────
  sync-upstream:
    runs-on: ubuntu-latest
    needs: resolve-upstream
    if: needs.resolve-upstream.outputs.already_synced == 'false'
    outputs:
      upstream_tag: ${{ needs.resolve-upstream.outputs.upstream_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote and fetch tag
        env:
          TAG: ${{ needs.resolve-upstream.outputs.upstream_tag }}
        run: |
          git remote add upstream https://github.com/ollama/ollama.git || true
          git fetch upstream "refs/tags/${TAG}:refs/tags/${TAG}" --no-tags

      - name: Merge upstream tag into main (preserve our commits)
        env:
          TAG: ${{ needs.resolve-upstream.outputs.upstream_tag }}
        run: |
          git merge "${TAG}" \
            --no-edit \
            --strategy-option=ours \
            -m "chore: sync upstream ${TAG} (preserve local changes)"

      - name: Push updated main and new tag
        env:
          TAG: ${{ needs.resolve-upstream.outputs.upstream_tag }}
        run: |
          git push origin main
          git tag -f "${TAG}-local"
          git push origin "${TAG}-local" --force

  # ─────────────────────────────────────────────
  # 3. Сборка Docker образа
  # ─────────────────────────────────────────────
  docker-build:
    runs-on: ubuntu-latest
    needs: [resolve-upstream, sync-upstream]
    # Запускать и когда нужна синхронизация, и когда уже синхронизировано
    if: |
      always() &&
      (needs.sync-upstream.result == 'success' || needs.sync-upstream.result == 'skipped') &&
      needs.resolve-upstream.result == 'success'
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
      image_tag:    ${{ steps.meta.outputs.tags }}
      upstream_tag: ${{ needs.resolve-upstream.outputs.upstream_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=raw,value=${{ needs.resolve-upstream.outputs.upstream_tag }}
            type=raw,value=latest

      - name: Build image (without push — for scanning)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Export image for next jobs
        run: |
          docker save "${{ env.DOCKER_IMAGE }}:${{ needs.resolve-upstream.outputs.upstream_tag }}" \
            | gzip > /tmp/ollama-image.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: ollama-docker-image
          path: /tmp/ollama-image.tar.gz
          retention-days: 1

  # ─────────────────────────────────────────────
  # 4. Сканирование безопасности (Trivy)
  # ─────────────────────────────────────────────
  security-scan:
    runs-on: ubuntu-latest
    needs: [resolve-upstream, docker-build]
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ollama-docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load < /tmp/ollama-image.tar.gz

      - name: Run Trivy vulnerability scan
        id: trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.DOCKER_IMAGE }}:${{ needs.resolve-upstream.outputs.upstream_tag }}"
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'          # Fail the job on CRITICAL/HIGH findings
          ignore-unfixed: true    # Ignore vulnerabilities without fix available

      - name: Upload Trivy SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-docker

      - name: Security scan summary
        if: success()
        run: echo "✅ Security scan passed — no unfixed CRITICAL/HIGH CVEs found."

  # ─────────────────────────────────────────────
  # 5. Публикация на Docker Hub
  # ─────────────────────────────────────────────
  docker-push:
    runs-on: ubuntu-latest
    needs: [resolve-upstream, docker-build, security-scan]
    # Публикуем только если сканирование прошло
    if: needs.security-scan.result == 'success'
    outputs:
      published_tag: ${{ needs.resolve-upstream.outputs.upstream_tag }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ollama-docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load < /tmp/ollama-image.tar.gz

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USER }}
          password: ${{ secrets.DH_TOKEN }}

      - name: Push image to Docker Hub
        env:
          TAG: ${{ needs.resolve-upstream.outputs.upstream_tag }}
          REPO: ${{ env.DOCKER_IMAGE }}
        run: |
          docker tag "${REPO}:${TAG}" "${REPO}:${TAG}"
          docker tag "${REPO}:${TAG}" "${REPO}:latest"
          docker push "${REPO}:${TAG}"
          docker push "${REPO}:latest"
          echo "✅ Pushed ${REPO}:${TAG} and ${REPO}:latest to Docker Hub"

  # ─────────────────────────────────────────────
  # 6. Smoke-тест образа, загруженного с Docker Hub
  # ─────────────────────────────────────────────
  smoke-test:
    runs-on: ubuntu-latest
    needs: [resolve-upstream, docker-push]
    steps:
      - name: Login to Docker Hub (pull)
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USER }}
          password: ${{ secrets.DH_TOKEN }}

      - name: Pull image from Docker Hub
        env:
          REPO: ${{ env.DOCKER_IMAGE }}
          TAG:  ${{ needs.resolve-upstream.outputs.upstream_tag }}
        run: |
          echo "Pulling ${REPO}:${TAG} from Docker Hub..."
          docker pull "${REPO}:${TAG}"
          echo "✅ Pull successful."

      - name: Run smoke test — check ollama version
        env:
          REPO: ${{ env.DOCKER_IMAGE }}
          TAG:  ${{ needs.resolve-upstream.outputs.upstream_tag }}
        run: |
          echo "Running 'ollama --version' inside container..."
          docker run --rm "${REPO}:${TAG}" ollama --version
          echo "✅ ollama --version returned successfully."

      - name: Run smoke test — container starts and responds
        env:
          REPO: ${{ env.DOCKER_IMAGE }}
          TAG:  ${{ needs.resolve-upstream.outputs.upstream_tag }}
        run: |
          docker run -d --name ollama-test \
            -p 11434:11434 \
            -e OLLAMA_HOST=0.0.0.0 \
            "${REPO}:${TAG}"
          echo "Waiting for ollama to start..."
          for i in $(seq 1 30); do
            STATUS=$(curl -sf http://localhost:11434/ 2>/dev/null | head -1 || true)
            if [ -n "$STATUS" ]; then
              echo "✅ ollama responded: $STATUS"
              docker stop ollama-test
              exit 0
            fi
            echo "Attempt $i/30 — waiting..."
            sleep 2
          done
          echo "❌ ollama did not start in time."
          docker logs ollama-test
          docker stop ollama-test
          exit 1

  # ─────────────────────────────────────────────
  # 7. Итоговый статус — успех только если
  #    security-scan + smoke-test прошли
  # ─────────────────────────────────────────────
  pipeline-success:
    runs-on: ubuntu-latest
    needs: [resolve-upstream, security-scan, smoke-test]
    if: always()
    steps:
      - name: Evaluate pipeline result
        env:
          SECURITY: ${{ needs.security-scan.result }}
          TEST:     ${{ needs.smoke-test.result }}
          TAG:      ${{ needs.resolve-upstream.outputs.upstream_tag }}
        run: |
          echo "═══════════════════════════════════════"
          echo "  Pipeline summary for tag: $TAG"
          echo "  Security scan : $SECURITY"
          echo "  Smoke test    : $TEST"
          echo "═══════════════════════════════════════"
          if [ "$SECURITY" = "success" ] && [ "$TEST" = "success" ]; then
            echo "✅ SUCCESS — image is secure and tested."
            exit 0
          else
            echo "❌ FAILURE — check the jobs above."
            exit 1
          fi
