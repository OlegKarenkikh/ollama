name: Docker Build, Security Scan & Publish

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

env:
  DOCKER_USER:  olegkarenkikh
  DOCKER_IMAGE: olegkarenkikh/ollama

jobs:
  docker-build:
    strategy:
      matrix:
        include:
          - target: final
            suffix: ''
            latest_tag: latest
            file: Dockerfile.secure
          - target: final
            suffix: '-gpu'
            latest_tag: gpu
            file: Dockerfile.gpu
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: false
          load: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ matrix.latest_tag }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.DOCKER_IMAGE }}:${{ matrix.latest_tag }}"
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USER }}
          password: ${{ secrets.DH_TOKEN }}

      - name: Push to Docker Hub
        if: github.event_name != 'pull_request'
        run: |
          docker push "${{ env.DOCKER_IMAGE }}:${{ matrix.latest_tag }}"
