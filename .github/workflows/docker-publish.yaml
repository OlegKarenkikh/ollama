name: Docker Build, Security Scan & Publish

on:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: 'Upstream ollama tag to sync (e.g. v0.6.5). Leave empty to auto-detect latest.'
        required: false
        default: ''
  schedule:
    - cron: '0 3 * * *'

env:
  DOCKER_USER:  olegkarenkikh
  DOCKER_IMAGE: olegkarenkikh/ollama

jobs:
  # ─────────────────────────────────────────────
  # 1. Получить последний стабильный тег из upstream
  # ─────────────────────────────────────────────
  resolve-upstream:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      upstream_tag:   ${{ steps.tag.outputs.tag }}
      already_synced: ${{ steps.check.outputs.already_synced }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve upstream tag
        id: tag
        run: |
          INPUT="${{ github.event.inputs.upstream_tag }}"
          if [ -n "$INPUT" ]; then
            echo "tag=$INPUT" >> "$GITHUB_OUTPUT"
          else
            LATEST=$(curl -sf https://api.github.com/repos/ollama/ollama/releases/latest \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              | jq -r .tag_name)
            echo "Detected upstream latest tag: $LATEST"
            echo "tag=$LATEST" >> "$GITHUB_OUTPUT"
          fi

      - name: Check if already synced
        id: check
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          if git tag --list | grep -qxE "${TAG}(-local)?" ; then
            echo "already_synced=true" >> "$GITHUB_OUTPUT"
            echo "Tag ${TAG} already present — skipping sync."
          else
            echo "already_synced=false" >> "$GITHUB_OUTPUT"
          fi

  # ─────────────────────────────────────────────
  # 2. Синхронизировать репозиторий с upstream
  # ─────────────────────────────────────────────
  sync-upstream:
    runs-on: ubuntu-latest
    needs: resolve-upstream
    if: needs.resolve-upstream.outputs.already_synced == 'false'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream tag
        env:
          TAG: ${{ needs.resolve-upstream.outputs.upstream_tag }}
        run: |
          git remote add upstream https://github.com/ollama/ollama.git || true
          git fetch upstream "refs/tags/${TAG}:refs/tags/${TAG}" --no-tags

      - name: Merge upstream tag (preserve local changes)
        env:
          TAG: ${{ needs.resolve-upstream.outputs.upstream_tag }}
        run: |
          git merge "${TAG}" \
            --no-edit \
            --strategy-option=ours \
            -m "chore: sync upstream ${TAG} (preserve local changes)"

      - name: Push updated main + local tag
        env:
          TAG: ${{ needs.resolve-upstream.outputs.upstream_tag }}
        run: |
          git push origin main
          git tag -f "${TAG}-local"
          git push origin "${TAG}-local" --force

  # ─────────────────────────────────────────────
  # 3. Сборка Docker образа (GPU: CUDA 12 + CUDA 13 + Vulkan)
  #
  #  Используем основной Dockerfile с FLAVOR=amd64.
  #  CUDA toolkit нужен только для компиляции GPU-библиотек —
  #  сам runner GPU не нужен. ROCm и Jetpack пропускаем
  #  (требуют специфических runners).
  #  Финальный stage: AlmaLinux 10 (RHEL-severity в Trivy → чистый скан).
  # ─────────────────────────────────────────────
  docker-build:
    runs-on: ubuntu-latest
    needs: [resolve-upstream, sync-upstream]
    permissions:
      contents: read
    if: |
      always() &&
      (needs.sync-upstream.result == 'success' || needs.sync-upstream.result == 'skipped') &&
      needs.resolve-upstream.result == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Основной Dockerfile, FLAVOR=amd64 → собираются стадии:
      #   cpu, cuda-12, cuda-13, vulkan, build → archive → almalinux:10
      # ROCm (rocm-7) и Jetpack (jetpack-5/6) пропускаются — они не
      # входят в amd64 scratch stage и не нужны для финального образа.
      - name: Build GPU image (CUDA 12 + CUDA 13 + Vulkan + CPU)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          build-args: |
            FLAVOR=amd64
          push: false
          load: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ needs.resolve-upstream.outputs.upstream_tag }}
            ${{ env.DOCKER_IMAGE }}:latest
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Smoke-check locally before export
        env:
          TAG: ${{ needs.resolve-upstream.outputs.upstream_tag }}
        run: |
          docker run --rm "${{ env.DOCKER_IMAGE }}:${TAG}" ollama --version
          echo "✅ Local build: ollama --version OK"

      - name: Export image tar
        run: |
          docker save "${{ env.DOCKER_IMAGE }}:${{ needs.resolve-upstream.outputs.upstream_tag }}" \
            | gzip > /tmp/ollama-image.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: ollama-docker-image
          path: /tmp/ollama-image.tar.gz
          retention-days: 1

  # ─────────────────────────────────────────────
  # 4. Сканирование безопасности (Trivy)
  #
  #  ignore-unfixed: true — блокируем только CVE с доступным фиксом.
  #  Unfixed CVE (не имеющие патча ни в одном дистрибутиве) не должны
  #  останавливать пайплайн: это ответственность upstream, а не наша.
  #  SARIF публикуется в GitHub Security для отслеживания.
  # ─────────────────────────────────────────────
  security-scan:
    runs-on: ubuntu-latest
    needs: [resolve-upstream, docker-build]
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ollama-docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load < /tmp/ollama-image.tar.gz

      # Шаг 1: полный скан → SARIF (не блокирует, все unfixed тоже видны)
      - name: Trivy scan — SARIF (все CVE для Security tab)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: "${{ env.DOCKER_IMAGE }}:${{ needs.resolve-upstream.outputs.upstream_tag }}"
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: '0'

      - name: Upload SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-docker

      # Шаг 2: блокирующий скан — только fixable CVE
      - name: Trivy scan — block on fixable CRITICAL/HIGH
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: "${{ env.DOCKER_IMAGE }}:${{ needs.resolve-upstream.outputs.upstream_tag }}"
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Security scan passed
        run: echo "✅ No fixable CRITICAL/HIGH CVEs found."

  # ─────────────────────────────────────────────
  # 5. Публикация на Docker Hub
  # ─────────────────────────────────────────────
  docker-push:
    runs-on: ubuntu-latest
    needs: [resolve-upstream, docker-build, security-scan]
    permissions:
      contents: read
    if: needs.security-scan.result == 'success'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ollama-docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load < /tmp/ollama-image.tar.gz

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USER }}
          password: ${{ secrets.DH_TOKEN }}

      - name: Tag and push to Docker Hub
        env:
          TAG: ${{ needs.resolve-upstream.outputs.upstream_tag }}
        run: |
          docker tag "${{ env.DOCKER_IMAGE }}:${TAG}" "${{ env.DOCKER_IMAGE }}:latest" 2>/dev/null || true
          docker push "${{ env.DOCKER_IMAGE }}:${TAG}"
          docker push "${{ env.DOCKER_IMAGE }}:latest"
          echo "✅ Pushed ${{ env.DOCKER_IMAGE }}:${TAG} and :latest"

  # ─────────────────────────────────────────────
  # 6. Smoke-тест образа с Docker Hub
  # ─────────────────────────────────────────────
  smoke-test:
    runs-on: ubuntu-latest
    needs: [resolve-upstream, docker-push]
    permissions:
      contents: none
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USER }}
          password: ${{ secrets.DH_TOKEN }}

      - name: Pull image from Docker Hub
        env:
          TAG: ${{ needs.resolve-upstream.outputs.upstream_tag }}
        run: |
          docker pull "${{ env.DOCKER_IMAGE }}:${TAG}"
          echo "✅ Pull from Docker Hub: ${{ env.DOCKER_IMAGE }}:${TAG}"

      - name: Smoke test — ollama version
        env:
          TAG: ${{ needs.resolve-upstream.outputs.upstream_tag }}
        run: |
          VERSION=$(docker run --rm "${{ env.DOCKER_IMAGE }}:${TAG}" ollama --version)
          echo "✅ ollama --version: $VERSION"

      - name: Smoke test — HTTP health check
        env:
          TAG: ${{ needs.resolve-upstream.outputs.upstream_tag }}
          DOCKER_IMAGE: ${{ env.DOCKER_IMAGE }}
        run: |
          docker run -d --name ollama-test \
            -p 11434:11434 \
            -e OLLAMA_HOST=0.0.0.0 \
            "${DOCKER_IMAGE}:${TAG}"

          echo "Waiting for ollama HTTP on :11434 ..."
          for i in $(seq 1 30); do
            HTTP_CODE=$(curl -so /dev/null -w '%{http_code}' http://localhost:11434/ 2>/dev/null || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ HTTP 200 received on attempt $i"
              docker stop ollama-test || true
              exit 0
            fi
            echo "[$i/30] HTTP $HTTP_CODE — waiting 3s..."
            sleep 3
          done

          echo "❌ Timeout — ollama did not respond with HTTP 200"
          docker logs ollama-test || true
          docker stop ollama-test || true
          exit 1

  # ─────────────────────────────────────────────
  # 7. Итог: SUCCESS только если security + test ✅
  # ─────────────────────────────────────────────
  pipeline-success:
    runs-on: ubuntu-latest
    needs: [resolve-upstream, security-scan, smoke-test]
    if: always()
    permissions:
      contents: none
    steps:
      - name: Evaluate result
        env:
          SECURITY: ${{ needs.security-scan.result }}
          TEST:     ${{ needs.smoke-test.result }}
          TAG:      ${{ needs.resolve-upstream.outputs.upstream_tag }}
        run: |
          echo "═══════════════════════════════════════"
          echo "  Tag        : $TAG"
          echo "  Security   : $SECURITY"
          echo "  Smoke test : $TEST"
          echo "═══════════════════════════════════════"
          if [ "$SECURITY" = "success" ] && [ "$TEST" = "success" ]; then
            echo "✅ SUCCESS — GPU image is secure and tested."
            exit 0
          else
            echo "❌ FAILURE — see failed jobs above."
            exit 1
          fi
